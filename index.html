
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZone - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">Shop<span>Zone</span></div>

        <div class="search-box">
            <input type="text" id="searchInput"
                placeholder="Search products...">
            <button id="searchBtn">Search</button>
        </div>

        <button class="cart-button" id="cartBtn">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Discover Amazing Products</h1>
            <p>Upgrade your lifestyle with the best deals.</p>
            <a href="#products" class="shop-btn">Shop Now</a>
        </div>
    </section>

    <!-- Products Section -->
    <main class="container" id="products">
        <h2>Our Products</h2>

        <div class="category-filter">
            <button class="filter-btn active" data-category="All">
                All
            </button>
            <button class="filter-btn" data-category="Electronics">
                Electronics
            </button>
            <button class="filter-btn" data-category="Fashion">
                Fashion
            </button>
            <button class="filter-btn" data-category="Home">
                Home
            </button>
            <button class="filter-btn" data-category="Accessories">
                Accessories
            </button>
        </div>

        <div class="product-grid" id="productContainer">
            <p>Loading products...</p>
        </div>
    </main>

    <!-- Shopping Cart -->
    <div class="cart-overlay" id="cartOverlay">
        <div class="cart-panel">
            <button class="close-cart" id="closeCart">✕</button>
            <h2>Your Shopping Cart</h2>

            <div id="cartItems"></div>

            <h3>Total: ₹<span id="cartTotal">0</span></h3>

            <button class="checkout-btn" id="checkoutBtn">
                Checkout
            </button>
        </div>
    </div>

    <footer>
        <p>© 2026 ShopZone. All Rights Reserved.</p>
        <p>Your one-stop destination for online shopping.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
